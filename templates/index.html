<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Room - {{ room_name }}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      background: #020617;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 20px;
      color: #e5e7eb;
    }

    .sub {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .room-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #111827;
      border-radius: 999px;
      padding: 4px 10px;
      color: #9ca3af;
    }

    .room-chip span {
      color: #e5e7eb;
      font-weight: 600;
    }

    #username {
      margin-bottom: 6px;
      padding: 8px 10px;
      width: 100%;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }

    #username:focus {
      border-color: #3b82f6;
    }

    #chat-box {
      border-radius: 12px;
      height: 420px;
      padding: 12px;
      overflow-y: auto;
      background: radial-gradient(circle at top left, #1f2937, #020617);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: flex;
      margin-bottom: 4px;
    }

    .message-row.own {
      justify-content: flex-end;
    }

    .message-row.other {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 8px 10px;
      border-radius: 14px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .own .bubble {
      background: #3b82f6;
      color: #f9fafb;
      border-bottom-right-radius: 2px;
    }

    .other .bubble {
      background: #111827;
      color: #e5e7eb;
      border-bottom-left-radius: 2px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      opacity: 0.85;
    }

    .username {
      font-weight: 600;
    }

    .time {
      font-variant-numeric: tabular-nums;
    }

    .text {
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    #message-form {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    #message-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }

    #message-input:focus {
      border-color: #3b82f6;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #022c22;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    button:active {
      transform: scale(0.97);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .link-note {
      font-size: 11px;
      color: #6b7280;
    }

    .link-note code {
      background: #020617;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="top-row">
      <div>
        <h1>Chat Room</h1>
        <div class="sub">Real-time chat. Share this room link with your friends.</div>
      </div>
    </div>

    <div class="room-chip">
      Room:
      <span id="room-name">{{ room_name }}</span>
    </div>
    <div class="link-note">
      To make another room, just change the URL like
      <code>/room/friends</code>, <code>/room/physics</code>, etc.
    </div>

    <input id="username" placeholder="Enter your name" />

    <div id="chat-box"></div>

    <form id="message-form">
      <input id="message-input" autocomplete="off" placeholder="Type a message..." />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- room name from backend for JS -->
  <div id="room-data" data-room="{{ room_name }}" style="display:none;"></div>

  <script>
    const room = document.getElementById("room-data").dataset.room;

    // ws / wss depending on http / https
    const protocol = window.location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${protocol}://${window.location.host}/ws/${encodeURIComponent(room)}`);

    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");
    const usernameInput = document.getElementById("username");

    let lastSentName = null; // track last username sent to server

    function formatTime(isoString) {
      const d = new Date(isoString);
      let h = d.getHours();
      let m = d.getMinutes();
      return `${h.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")}`;
    }

    function appendMessage(messageObj, isOwn) {
      const row = document.createElement("div");
      row.classList.add("message-row");
      row.classList.add(isOwn ? "own" : "other");

      const bubble = document.createElement("div");
      bubble.classList.add("bubble");

      const meta = document.createElement("div");
      meta.classList.add("meta");

      const userSpan = document.createElement("span");
      userSpan.classList.add("username");
      userSpan.textContent = isOwn ? "You" : (messageObj.username || "Unknown");

      const timeSpan = document.createElement("span");
      timeSpan.classList.add("time");
      timeSpan.textContent = formatTime(messageObj.timestamp || new Date().toISOString());

      meta.appendChild(userSpan);
      meta.appendChild(timeSpan);

      const textDiv = document.createElement("div");
      textDiv.classList.add("text");
      textDiv.textContent = messageObj.text || "";

      bubble.appendChild(meta);
      bubble.appendChild(textDiv);
      row.appendChild(bubble);
      chatBox.appendChild(row);

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    ws.onmessage = (event) => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (e) {
        // Not JSON, ignore or handle if you like
        return;
      }

      if (data.type !== "message") {
        return; // only show normal chat messages
      }

      const currentName = usernameInput.value.trim();
      const isOwn = currentName !== "" && data.username === currentName;

      appendMessage(data, isOwn);
    };

    function sendJoinIfNeeded(name) {
      if (name && name !== lastSentName) {
        const joinMsg = {
          type: "join",
          username: name
        };
        ws.send(JSON.stringify(joinMsg));
        lastSentName = name;
      }
    }

    // When user sends a message
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      let name = usernameInput.value.trim();
      if (!name) {
        name = "Anon";
      }

      if (text !== "") {
        // ensure server knows our username for admin
        sendJoinIfNeeded(name);

        const message = {
          type: "message",
          username: name,
          text: text,
          timestamp: new Date().toISOString()
        };
        ws.send(JSON.stringify(message));
        input.value = "";
      }
    });

    // Optionally, when username field loses focus, send join
    usernameInput.addEventListener("blur", () => {
      const name = usernameInput.value.trim();
      if (name) {
        sendJoinIfNeeded(name);
      }
    });
  </script>
</body>
</html>
